[project]
name = "zh-math-reading"
version = "0.1.0"
description = "数学旁白的中文读法：LaTeX 转读法、多音字数据、给 TTS 用的安全改写与检查"
readme = "README.md"
license = "MIT"
authors = [{ name = "Boxi Yu" }]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
zh-math-reading = "zh_math_reading.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zh_math_reading"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "zh_math_reading/data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
